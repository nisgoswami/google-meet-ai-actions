name: Release extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-release.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:browser
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-package
          path: dist/google-meet-ai-actions-*.zip
          if-no-files-found: error

  publish:
    needs: test
    if: github.repository == 'nisgoswami/google-meet-ai-actions' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: chrome-web-store-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/validate-release.mjs
      - run: python3 scripts/package.py
      - name: Authenticate with short-lived Google credentials
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.CWS_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false
      - name: Verify publishing access (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/publish-store.mjs --verify
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      - name: Submit tagged version for store review
        if: github.ref_type == 'tag'
        run: node scripts/publish-store.mjs
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      - name: Create GitHub release with ZIP
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/google-meet-ai-actions-*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/google-meet-ai-actions-*.zip --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
